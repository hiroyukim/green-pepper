<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <title>gp — CSV Request Runner</title>
  <style>
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; max-width: 960px; margin: 2rem auto; padding: 0 1rem; color: #1a1a1a; }
    h1 { font-size: 1.4rem; }
    .card { border: 1px solid #ddd; border-radius: 8px; padding: 1.25rem; margin-bottom: 1.5rem; }
    .meta { color: #555; font-size: 0.9rem; }
    .meta code { background: #f2f2f2; padding: 0.1rem 0.3rem; border-radius: 4px; }
    input[type="file"] { display: block; margin: 0.75rem 0; }
    button { background: #2563eb; color: #fff; border: none; padding: 0.5rem 1.25rem; border-radius: 6px; font-size: 1rem; cursor: pointer; }
    button:hover { background: #1d4ed8; }
    table { border-collapse: collapse; width: 100%; margin-top: 1rem; font-size: 0.9rem; }
    th, td { border-bottom: 1px solid #eee; padding: 0.4rem 0.6rem; text-align: left; }
    th { background: #fafafa; }
    .ok { color: #15803d; font-weight: 600; }
    .fail { color: #b91c1c; font-weight: 600; }
    .summary { margin-top: 0.75rem; font-weight: 600; }
    .error-box { color: #b91c1c; background: #fef2f2; border: 1px solid #fecaca; padding: 0.75rem 1rem; border-radius: 6px; margin-bottom: 1.5rem; }
  </style>
</head>
<body>
  <h1>gp — CSV Request Runner</h1>
  {{template "content" .}}
</body>
</html>
